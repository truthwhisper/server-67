{% extends "base.html" %}{% block title %}{{ t('Set up 2FA') }} — {{ site_name }}{% endblock %}{% block content %}<div class="page-wrap narrow"><a class="back-link" href="{{ url_for('account.index') }}">← {{ t('Account') }}</a><div class="page-heading"><div><span class="kicker">{{ t('TWO-FACTOR AUTHENTICATION') }}</span><h1>{{ t('Connect your authenticator') }}</h1><p>{{ t('Scan the QR code, then enter the current six-digit code.') }}</p></div></div><section class="panel form-panel"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><img class="qr-code" src="data:image/svg+xml;base64,{{ qr_data }}" alt="{{ t('Authenticator QR code') }}"><label>{{ t('Manual setup key') }}<input value="{{ secret }}" readonly></label><label>{{ t('Verification code') }}<input name="code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" required></label><button class="button primary">{{ t('Enable two-factor authentication') }}</button></form></section></div>{% endblock %}
