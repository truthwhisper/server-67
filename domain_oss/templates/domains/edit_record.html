{% extends "base.html" %}{% block title %}{{ t('Edit DNS record') }} — {{ site_name }}{% endblock %}
{% block content %}<div class="page-wrap narrow"><a class="back-link" href="{{ url_for('domains.detail', domain_id=domain.id) }}">← {{ domain.fqdn }}</a><div class="page-heading"><div><span class="kicker">{{ t('DNS RECORD') }}</span><h1>{{ t('Edit record') }}</h1><p>{{ t('Changes are synchronized through the DNS job queue.') }}</p></div></div><section class="panel form-panel"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid record-grid"><label>{{ t('Type') }}<select name="record_type" required>{% for type in ['A','AAAA','CNAME','MX','TXT','SRV','CAA','NS'] %}<option {% if type == record.record_type %}selected{% endif %}>{{ type }}</option>{% endfor %}</select></label><label>{{ t('Name') }}<input name="name" value="{{ record.name }}" required maxlength="253"></label></div><label>{{ t('Value') }}<textarea name="content" rows="3" required maxlength="2048">{{ record.content }}</textarea></label><div class="form-grid"><label>TTL<input type="number" name="ttl" value="{{ record.ttl }}" min="60" max="86400" required></label><label>{{ t('Priority') }}<input type="number" name="priority" value="{{ record.priority if record.priority is not none else '' }}" min="0" max="65535"></label></div><button class="button primary" type="submit">{{ t('Save and synchronize') }}</button></form></section></div>{% endblock %}
