{% extends "base.html" %}{% block title %}{{ t('Settings') }} — {{ site_name }}{% endblock %}
{% block content %}<div class="page-wrap narrow"><div class="page-heading"><div><span class="kicker">{{ t('ADMINISTRATION · SETTINGS') }}</span><h1>{{ t('Instance settings') }}</h1><p>{{ t('Configure registration, account limits, and instance identity.') }}</p></div></div><section class="panel form-panel"><form method="post" class="stack-form settings-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t('Site name') }}<input name="site_name" required maxlength="80" value="{{ site_name }}"></label><label>{{ t('Maximum domains per user') }}<input type="number" name="max_domains_per_user" required min="1" max="100" value="{{ get_setting('max_domains_per_user', '3') if get_setting is defined else '3' }}"><small>{{ t('Administrators are not subject to this limit.') }}</small></label><label class="switch-row"><span><strong>{{ t('Public registration') }}</strong><small>{{ t('Allow visitors to create their own account.') }}</small></span><input type="checkbox" name="registration_enabled" {% if get_setting is defined and get_setting('registration_enabled', '1') == '1' %}checked{% endif %}></label><button class="button primary" type="submit">{{ t('Save settings') }}</button></form></section></div>{% endblock %}
