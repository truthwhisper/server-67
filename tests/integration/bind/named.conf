options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    minimal-responses yes;
};

key "domain-oss-key" {
    algorithm hmac-sha256;
    secret "MDEyMzQ1Njc4OWFiY2RlZg==";
};

zone "bind.test" {
    type primary;
    file "/etc/bind/db.bind.test";
    journal "/var/cache/bind/db.bind.test.jnl";
    update-policy {
        grant domain-oss-key zonesub ANY;
    };
};
